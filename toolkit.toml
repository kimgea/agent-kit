schema_version = 2
toolkit_version = "1.9.0"
minimum_python = "3.11"

[plugin_marketplace]
name = "agent-kit"
display_name = "Agent Kit"
author_name = "kimgea"
author_url = "https://github.com/kimgea"
homepage = "https://github.com/kimgea/agent-kit"
repository = "https://github.com/kimgea/agent-kit"
license = "MIT"

[[plugins]]
id = "agent-context"
skills = ["agent-context"]
category = "Productivity"
installation = "AVAILABLE"
authentication = "ON_INSTALL"

[[plugins]]
id = "artifacts"
skills = ["build-interactive-diagram", "serve-artifacts"]
category = "Developer Tools"
installation = "AVAILABLE"
authentication = "ON_USE"
version = "1.0.0"
description = "Create polished interactive web artifacts and share them through a transient local-first host."
display_name = "Interactive Artifacts"
short_description = "Build and host temporary interactive visuals"
default_prompts = [
  "Use $build-interactive-diagram to turn this explanation into an interactive visual.",
  "Use $serve-artifacts to publish this web artifact and return a browser URL.",
]

[[plugins]]
id = "grill-me"
skills = ["grill-me"]
category = "Productivity"
installation = "AVAILABLE"
authentication = "ON_INSTALL"

[[plugins]]
id = "project-review"
skills = ["project-review", "review-and-fix", "review-guidance-audit", "verification-harness-audit"]
category = "Developer Tools"
installation = "AVAILABLE"
authentication = "ON_INSTALL"
version = "1.4.0"
description = "Review bounded project changes, safely remediate findings, improve hierarchical guidance, and audit local verification harnesses."
display_name = "Project Review Workflow"
short_description = "Review, remediate, and audit verification"
default_prompts = [
  "Use $project-review to review these bounded project changes.",
  "Use $review-and-fix to review and safely fix these local changes.",
  "Use $review-guidance-audit for guidance, or $verification-harness-audit for the local verification harness.",
]

[[plugins]]
id = "todo-capture"
skills = ["todo-capture"]
category = "Productivity"
installation = "AVAILABLE"
authentication = "ON_INSTALL"

[[plugins]]
id = "tool-audit"
skills = ["tool-audit"]
category = "Productivity"
installation = "AVAILABLE"
authentication = "ON_INSTALL"

[[resources]]
id = "agent-context"
kind = "skill"
path = "skills/agent-context"
version = "1.0.0"
summary = "Resolve public defaults and explicitly registered private context layers."
agents = ["codex", "claude"]
platforms = ["linux", "windows", "macos"]
maturity = "stable"
installable = true
setup_requires_approval = false
data_sensitivity = "private local context selected by the user"
docs = "docs/agent-context.md"
tests = ["tests/test_agent_context.py", "tests/test_agent_kit.py"]
evals = "evals/agent-context/cases.json"

[[resources]]
id = "build-interactive-diagram"
kind = "skill"
path = "skills/build-interactive-diagram"
version = "1.0.0"
summary = "Create polished interactive HTML diagrams for visual explanations."
agents = ["codex", "claude"]
platforms = ["linux", "windows", "macos"]
maturity = "stable"
installable = true
setup_requires_approval = false
data_sensitivity = "user-provided conversation and diagram content"
docs = "docs/artifact-host.md"
tests = ["tests/test_artifact_host.py", "tests/test_agent_kit.py"]
evals = "evals/build-interactive-diagram/cases.json"

[[resources]]
id = "grill-me"
kind = "skill"
path = "skills/grill-me"
version = "1.0.0"
summary = "Pressure-test decisions and artifacts through focused questioning."
agents = ["codex", "claude"]
platforms = ["linux", "windows", "macos"]
maturity = "stable"
installable = true
setup_requires_approval = false
data_sensitivity = "user-provided conversation context"
docs = "docs/grill-me.md"
tests = ["tests/test_agent_kit.py"]
evals = "evals/grill-me/cases.json"

[[resources]]
id = "project-review"
kind = "skill"
path = "skills/project-review"
version = "1.0.0"
summary = "Review bounded project changes under hierarchical REVIEW.md guidance."
agents = ["codex", "claude"]
platforms = ["linux", "windows", "macos"]
maturity = "beta"
installable = true
setup_requires_approval = false
data_sensitivity = "repository source, user review guidance, command summaries, and generated findings"
docs = "docs/project-review.md"
tests = ["tests/test_project_review.py", "tests/test_behavioral_eval.py", "tests/test_agent_kit.py"]
evals = "evals/project-review/cases.json"
behavioral_evals = "evals/project-review/suite.json"

[[resources]]
id = "review-and-fix"
kind = "skill"
path = "skills/review-and-fix"
version = "1.1.0"
summary = "Turn local review findings into bounded fixes through conservative decision gates and fresh re-review."
agents = ["codex", "claude"]
platforms = ["linux", "windows", "macos"]
maturity = "beta"
installable = true
setup_requires_approval = false
data_sensitivity = "repository source, reviewer output, normalized findings, and local fix plans"
docs = "docs/review-and-fix.md"
tests = ["tests/test_review_and_fix.py", "tests/test_behavioral_eval.py", "tests/test_agent_kit.py"]
evals = "evals/review-and-fix/cases.json"
behavioral_evals = "evals/review-and-fix/suite.json"

[[resources]]
id = "review-guidance-audit"
kind = "skill"
path = "skills/review-guidance-audit"
version = "1.1.0"
summary = "Audit hierarchical REVIEW.md guidance for useful, compact, correctly placed review policy."
agents = ["codex", "claude"]
platforms = ["linux", "windows", "macos"]
maturity = "beta"
installable = true
setup_requires_approval = false
data_sensitivity = "repository source, active-agent review guidance, context metrics, and generated recommendations"
docs = "docs/review-guidance-audit.md"
tests = ["tests/test_review_guidance_audit.py", "tests/test_behavioral_eval.py", "tests/test_agent_kit.py"]
evals = "evals/review-guidance-audit/cases.json"
behavioral_evals = "evals/review-guidance-audit/suite.json"

[[resources]]
id = "verification-harness-audit"
kind = "skill"
path = "skills/verification-harness-audit"
version = "1.0.0"
summary = "Audit a selected local verification harness under hierarchical review guidance."
agents = ["codex", "claude"]
platforms = ["linux", "windows", "macos"]
maturity = "beta"
installable = true
setup_requires_approval = false
data_sensitivity = "repository source, active-agent review guidance, caller-supplied evidence metadata, command summaries, and generated recommendations"
docs = "docs/verification-harness-audit.md"
tests = ["tests/test_verification_harness_audit.py", "tests/test_agent_kit.py"]

[[resources]]
id = "serve-artifacts"
kind = "skill"
path = "skills/serve-artifacts"
